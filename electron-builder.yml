appId: com.poketoken.desktop
productName: PokeToken Desktop
directories:
  output: release
asarUnpack:
  - node_modules/better-sqlite3/**/*
# Keep the UI's three languages and macOS's language-neutral resources.
electronLanguages:
  - en-US
  - ko
  - ja
  - Base
afterPack: scripts/verify-package.cjs
npmRebuild: true
artifactName: PokeToken-Desktop-${version}-${os}-${arch}.${ext}
win:
  # Each platform needs a complete allowlist. A separate exclude-only FileSet
  # would otherwise default to copying the whole checkout.
  files:
    - out/**/*
    - package.json
    - THIRD_PARTY_NOTICES.md
    - LICENSE
    - build/tray.png
    - '!node_modules/better-sqlite3/{deps,src}/**/*'
    - '!node_modules/better-sqlite3/binding.gyp'
    - '!node_modules/node-addon-api/**/*.{h,c,gyp,gypi}'
    - '!node_modules/node-addon-api/tools/**/*'
    - '!node_modules/better-sqlite3/prebuilds/!(win32-${arch}).node'
  extraResources:
    - from: native/window-surfaces.ps1
      to: native/window-surfaces.ps1
    - from: native/portable-update.ps1
      to: native/portable-update.ps1
  target:
    - nsis
    - portable
  signExecutable: false
  icon: build/icon.ico
mac:
  # Ad-hoc signed builds use the in-app version check and DMG download link.
  publish:
    provider: github
    owner: KHLEE72
    repo: pokeTokenDesktop
    releaseType: draft
    publishAutoUpdate: false
  files:
    - out/**/*
    - package.json
    - THIRD_PARTY_NOTICES.md
    - LICENSE
    - build/tray.png
    - '!node_modules/better-sqlite3/{deps,src}/**/*'
    - '!node_modules/better-sqlite3/binding.gyp'
    - '!node_modules/node-addon-api/**/*.{h,c,gyp,gypi}'
    - '!node_modules/node-addon-api/tools/**/*'
    - '!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}).node'
  extraResources:
    - from: build/native/window-surfaces
      to: native/window-surfaces
  target: dmg
  icon: build/icon-mac.png
  category: public.app-category.entertainment
  minimumSystemVersion: '14.0'
  # Local test signature; no Apple Developer certificate or notarization.
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  sign: false
nsis:
  artifactName: PokeToken-Desktop-${version}-Setup-${arch}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
publish:
  provider: github
  owner: KHLEE72
  repo: pokeTokenDesktop
  releaseType: draft
