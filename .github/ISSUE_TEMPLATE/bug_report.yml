name: Bug report / 오류 제보
description: Report a reproducible problem with the app.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        한국어·English·日本語 모두 가능합니다.
        Do not attach raw Claude/Codex conversations, databases, credentials or personal paths.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, display scale and monitors
      placeholder: "Windows 11 · 150% · two monitors / macOS 14 · Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant diagnostics (optional)
      description: Review and remove private information before sharing.
